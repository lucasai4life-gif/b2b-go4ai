<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }

    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f6f5; color: #0b2020; }
    main { width: min(100% - 2rem, 42rem); padding: 3rem; border-radius: 1.5rem; background: #fff; box-shadow: 0 12px 40px rgba(0, 40, 30, .08); }
    img { width: 64px; height: auto; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin: 1.5rem 0 1rem; }
    p { line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .85rem 1.25rem; border-radius: .6rem; color: #fff; background: #087f65; text-decoration: none; font-weight: 700; }
    a:hover, a:focus-visible { background: #06694f; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/images/logos/logo-go4ai-life.png" alt="GO4AI LIFE">
